name: Validate Scenes

on: [push, pull_request]

jobs:
  validate-scenes:
    name: Scene Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Library
        uses: actions/cache@v3
        with:
          path: 3701-Game/Library
          key: Library-Validation
          restore-keys: Library-

      - name: Run Scene Validator (No Build)
        uses: game-ci/unity-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: 3701-Game
          args: -batchmode -nographics -quit -executeMethod GameplayUIValidator.Validate
